# Release packages for Windows, Linux and macOS.
# Tag pushes (v*) and a workflow_dispatch that sets release_tag attach the files to that GitHub release.
# A dispatch without release_tag only uploads workflow artifacts. This workflow does not create tags or releases.
# macOS builds are ad-hoc signed (codesign -s -) and are NOT notarized: Gatekeeper will warn.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach files to (empty: artifacts only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).SelectSingleNode('//Version').InnerText.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Directory.Build.props has no <Version>." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }

      # xvfb for the smoke test; ImageMagick only to turn assets/tinyfix.ico into a png (skipped when it cannot).
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.rid }} -Version ${{ steps.version.outputs.version }}

      # The single-file host extracts native libraries before Main logs the start line, so poll a little past 6s.
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path ([System.IO.Path]::GetTempPath()) ("tinyfix-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:TINYFIX_DATA_DIR = $data
          $env:TINYFIX_SKIP_SETUP = '1'
          $bin = (Resolve-Path "artifacts/${{ matrix.rid }}/TinyFix.exe").Path
          $proc = Start-Process -FilePath $bin -PassThru
          $logPath = Join-Path $data 'logs\tinyfix.log'
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) { break }
            if ($i -ge 6 -and (Test-Path -LiteralPath $logPath)) {
              $text = Get-Content -LiteralPath $logPath -Raw
              if ($text -match 'TinyFix .+ starting' -and $text -notmatch 'Exception') { $ok = $true; break }
            }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            Write-Host "---- log ----"
            if (Test-Path -LiteralPath $logPath) { Get-Content -LiteralPath $logPath }
            throw "Smoke test failed (running=$($proc.HasExited -eq $false) before stop)."
          }

      - name: Smoke test
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          export TINYFIX_DATA_DIR="$data"
          export TINYFIX_SKIP_SETUP=1
          bin="$(pwd)/artifacts/${{ matrix.rid }}/TinyFix"
          chmod +x "$bin"
          xvfb-run -a "$bin" >"$data/stdout.txt" 2>"$data/stderr.txt" &
          pid=$!
          ok=0
          for i in $(seq 1 20); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            log="$data/logs/tinyfix.log"
            if [ "$i" -ge 6 ] && [ -f "$log" ] && grep -q "TinyFix .* starting" "$log" && ! grep -q "Exception" "$log"; then
              ok=1
              break
            fi
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            wait "$pid" || true
          fi
          if [ "$ok" -ne 1 ]; then
            echo "---- log ----"
            cat "$data/logs/tinyfix.log" 2>/dev/null || true
            echo "---- stderr ----"
            cat "$data/stderr.txt" 2>/dev/null || true
            exit 1
          fi

      # Hosted macOS runners often have no Aqua session, so a tray app may exit. The dmg is still produced.
      # Not notarized (see the top of this file).
      - name: Smoke test
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "macOS smoke test is non-fatal: the runner may not be able to open a tray app (no window server)."
          data=$(mktemp -d)
          export TINYFIX_DATA_DIR="$data"
          export TINYFIX_SKIP_SETUP=1
          bin="$(pwd)/artifacts/${{ matrix.rid }}/TinyFix"
          chmod +x "$bin"
          "$bin" >"$data/stdout.txt" 2>"$data/stderr.txt" &
          pid=$!
          ok=0
          for i in $(seq 1 20); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            log="$data/logs/tinyfix.log"
            if [ "$i" -ge 6 ] && [ -f "$log" ] && grep -q "TinyFix .* starting" "$log" && ! grep -q "Exception" "$log"; then
              ok=1
              break
            fi
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            wait "$pid" || true
          fi
          if [ "$ok" -ne 1 ]; then
            echo "---- log ----"
            cat "$data/logs/tinyfix.log" 2>/dev/null || true
            echo "---- stderr ----"
            cat "$data/stderr.txt" 2>/dev/null || true
            echo "Smoke test did not pass; continuing because a GUI session may be unavailable."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/dist/TinyFix-*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).SelectSingleNode('//Version').InnerText.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      # sha256sum, LF, bare file names (no directories).
      - name: SHA256
        run: |
          set -euo pipefail
          cd collected
          find . -type f -printf '%f\n' | sort > ../names.txt
          : > "../TinyFix-${{ steps.version.outputs.version }}-SHA256SUMS.txt"
          while IFS= read -r name; do
            sha256sum "$name" >> "../TinyFix-${{ steps.version.outputs.version }}-SHA256SUMS.txt"
          done < ../names.txt
          # Reject CR so the file is LF-only even if a tool wrote CRLF.
          sed -i 's/\r$//' "../TinyFix-${{ steps.version.outputs.version }}-SHA256SUMS.txt"
          mv "../TinyFix-${{ steps.version.outputs.version }}-SHA256SUMS.txt" .

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: collected/TinyFix-${{ steps.version.outputs.version }}-SHA256SUMS.txt

      - name: Attach to the GitHub release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          cd collected
          gh release upload "$RELEASE_TAG" TinyFix-* --clobber
