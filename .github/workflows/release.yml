name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch model and run tests
        run: |
          powershell -File scripts/fetch-model.ps1
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build setup.exe
        run: powershell -File scripts/build.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          if (-not $tag) { throw "Release tag is missing" }
          if (gh release view $tag) {
            gh release upload $tag dist/TinyFix-Setup.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag dist/TinyFix-Setup.exe dist/SHA256SUMS.txt --title "TinyFix Hotkey $tag" --generate-notes --latest
          }
