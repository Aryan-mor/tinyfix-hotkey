name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch model and run tests
        run: |
          powershell -File scripts/fetch-model.ps1
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build setup.exe
        run: powershell -File scripts/build.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (gh release view $tag) {
            gh release upload $tag dist/TinyFix-Setup.exe --clobber
          } else {
            gh release create $tag dist/TinyFix-Setup.exe --title "TinyFix Hotkey $tag" --generate-notes --latest
          }
