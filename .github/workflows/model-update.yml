name: Model update

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare Hugging Face model revision
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinPath = 'model-revision.txt'
          $current = (Get-Content $pinPath -Raw).Trim()
          $api = Invoke-RestMethod -Uri 'https://huggingface.co/api/models/paperweight/tinyfix' -TimeoutSec 30
          $latest = [string]$api.sha
          if (-not $latest) { throw 'Hugging Face API did not return a sha' }
          Write-Host "Pinned: $current"
          Write-Host "Latest: $latest"
          if ($latest -eq $current) {
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'Model pin is already current.'
            exit 0
          }
          # utf8 (no BOM) so later sha comparisons stay clean
          [System.IO.File]::WriteAllText((Resolve-Path $pinPath), $latest + "`n")
          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Test with the new model, bump patch, commit and tag
        if: steps.detect.outputs.changed == 'true'
        id: bump
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem models -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne '.gitkeep' } |
            Remove-Item -Force
          powershell -File scripts/fetch-model.ps1
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          $newVersion = (python scripts/bump-version.py --patch).Trim()
          if (-not $newVersion) { throw 'Version bump failed' }
          $tag = "v$newVersion"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-revision.txt VERSION app.py installer/tinyfix.iss
          git commit -m "Bump to $tag: refresh paperweight/tinyfix model"
          git tag $tag
          git push origin HEAD:main
          git push origin $tag

  # A tag created with GITHUB_TOKEN does not trigger on.push.tags, so
  # call the release workflow directly instead of relying on the tag hook.
  release:
    needs: check
    if: needs.check.outputs.changed == 'true' && needs.check.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
