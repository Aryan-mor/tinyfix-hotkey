name: Offline pack

# Publishes the optional offline pack (numpy + onnxruntime + model) to the "offline-pack" release.
# Run it by hand when the model, the Python version, or offline_pack.REQUIRED_PACK_VERSION changes.
# App releases do not need it: the app downloads the pack from this release on demand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch model
        run: powershell -File scripts/fetch-model.ps1
      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build the pack
        run: python scripts/build_pack.py --out dist/pack
      - name: Publish to the offline-pack release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist/pack -File | ForEach-Object { $_.FullName }
          gh release view offline-pack *> $null
          # The app's update check reads GitHub's "latest release". This release must NEVER be "latest", or every
          # TinyFix update check would see the tag "offline-pack" instead of a version. Pre-releases are skipped
          # by "latest", and the pack is still downloadable from its fixed URL.
          if ($LASTEXITCODE -eq 0) {
            gh release upload offline-pack $files --clobber
          } else {
            gh release create offline-pack $files --title "Offline pack" --notes "Optional download used by TinyFix. Not an app release." --prerelease --latest=false
          }
          gh release edit offline-pack --prerelease --latest=false
